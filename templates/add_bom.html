<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css_zaire/Add_BOM.css">
    <title>Document</title>
</head>
<body>

    <style>
        .table-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .table-container table {
            width: 49%; /* Ajuste conforme necessário */
        }
    </style>


    <!-- Formulário para envio de dados via Excel -->
    <div class="right-side-1">
        <p class="form-description">O arquivo Excel deve conter apenas uma aba e as seguintes colunas: 'Placa', 'Versao', 'Componente', 'Quantidade', 'Designator'. Deixar sempre PCI na primeira linha da versão.</p>
        <form method="POST" action="{{ url_for('BOM.add_BOMs') }}" enctype="multipart/form-data">
            <label for="file" class="form-label">Selecione um arquivo Excel:</label>
            <input type="file" name="file" id="file" accept=".xlsx" required class="form-input">
            <div class="button-container"style="display: flex; justify-content: flex-end; margin-right: 25.5px;">
                <button type="submit" class="btn btn-outline-success">Enviar</button>
            </div>
        </form>
    </div>

    <!-- Formulário para envio manual de dados -->
    <div class="right-side-2">
        <p class="form-description">Preencha os dados da nova linha:</p>
        <form method="POST" action="{{ url_for('BOM.add_BOMs') }}">
            <div class="form-row">
                <div class="form-group">
                    <label for="new_placa" class="form-label">Placa:</label>
                    <input type="text" name="new_placa" required class="form-input">
                </div>
                <div class="form-group">
                    <label for="new_versao" class="form-label">Versão:</label>
                    <input type="text" name="new_versao" required class="form-input">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="new_quantidade" class="form-label">Quantidade:</label>
                    <input type="number" name="new_quantidade" required class="form-input">
                </div>
                <div class="form-group">
                    <label for="new_designator" class="form-label">Designador:</label>
                    <input type="text" name="new_designator" required class="form-input">
                </div>
            </div>
    
            <div class="form-row">
                <div class="form-group">
                    <label for="new_componente" class="form-label">Componente:</label>
                    <input type="text" name="new_componente" required class="form-input">
                </div>
                <div class="form-group">
                    <label for="new_status" class="form-label">Status:</label>
                    <input type="text" name="new_status" required class="form-input" disabled>
                </div>
            </div>
            
                <div class="button-container"style="display: flex; justify-content: flex-end; margin-right: 32.5px;">
                    <button type="submit" class="btn btn-outline-success">Enviar</button>
                </div>
        </form>
    </div>
    <!-- Menu e Flash -->
    {% include 'menu.html' %}
    <script src="../static/js_zaire/salvar_edit.js"></script>
</body>
</html>
